# Katya Steps — the browser-half row.
#
# The package's main entry is an empty host plugin. Its only purpose is the
# Loader row itself: client bundles are discovered by scanning enabled entries
# for a package declaring `dsh.client`, so without this row the browser half
# never enters the start graph. Removing this line (and restarting) restores
# the official chat rendering; no official file is touched either way.
- insert:
    - id: katya-steps
      name: '@local/dsh-katya-workflow'
