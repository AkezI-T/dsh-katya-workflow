# Agent preset katya-creator: Katya's persona over the deployment's Creator
# tool surface. The shipped `cordis` preset (UI name "Creator mode") is what a
# session needs to inspect the running Loader and author DSH plugins and
# presets; this preset is that surface with Katya's voice in front of it.
#
# Three deltas over the `katya-workflow` composition in cordis.patch.yml —
# the same three the shipped `cordis` preset makes over `standard`:
#
#   1. `skill-filesystem.customSkillDirs` — the four authoring skills shipped
#      inside @deepseek-ai/dsh-agent-preset. The directory is resolved at mount
#      time from the running installation instead of being copied here, so a
#      DSH upgrade brings the matching skill text. If resolution finds nothing
#      the root stays empty: the skills are absent, the preset still mounts.
#   2. `tool-cordis` — read-only runtime API inspection of Host and Client.
#      Its providers are host-plane rows (`cordis-host-runner` and
#      `tool-cordis/host`); this row is only the model-facing half.
#   3. `tool-plugin-manager` / `tool-plugin-market` — persistent profile
#      changes. Both stay disabled without a `profileContext`, exactly as the
#      shipped presets declare them.
#
# Everything else matches `katya-workflow`, including PTC presentation: the
# catalog reaches the model as `run_code` plus a generated SDK, so the
# inspection results and the plugin-manager calls are handled inside one
# program. Re-enabling `tool-workflow` and dropping `tool-presentation` would
# give Creator mode the shipped preset's native tool catalog instead.
#
# The persona row reads ./persona.md through the same bundled module the other
# preset uses, so a persona edit reaches both.
- insert:
    - id: preset-katya-creator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: katya-creator
        name: Katya-Creator
        description: Katya 的创造模式：人格沿用人格文件，另挂运行时探查、插件管理与创造技能，可自行编写 DSH 插件与预设。
        order: 14
        plugins:
          # ── identity ────────────────────────────────────────────────────────────────

          - id: persona
            name: '@local/dsh-katya-workflow/persona-file.mjs'
            config:
              path: './persona.md'

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          # ── shell ───────────────────────────────────────────────────────────────────

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────────────

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'

          # ── skills ──────────────────────────────────────────────────────────────────

          # Creator delta 1: the authoring skills come from the installed
          # @deepseek-ai/dsh-agent-preset rather than from this repository.
          #
          # Resolution tries the running Host's own module tree first
          # (`process.argv[1]` is the app.asar entry under the desktop host, the
          # CLI entry under `dsh web`), then the conventional asar location. A
          # path that does not exist is an empty root, not a mount failure.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js >-
                    (() => {
                      const path = process.getBuiltinModule('node:path')
                      const { createRequire } = process.getBuiltinModule('node:module')
                      const bases = [process.argv[1], typeof baseUrl === 'string' ? baseUrl : undefined].filter(Boolean)
                      for (const base of bases) {
                        try {
                          return path.join(path.dirname(createRequire(base).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
                        } catch {}
                      }
                      return path.join(process.resourcesPath ?? '.', 'app.asar', 'dsh', 'node_modules', '@deepseek-ai', 'dsh-agent-preset', 'skills')
                    })()

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ───────────────────────────────────────────────────────────────────

          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ───────────────────────────────────────────────────────────────

          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ──────────────────────────────────────────────────────────────

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ────────────────────────────────────────────────

          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  agentOptions:
                    provider: deepseek-official
                    model: deepseek-flash
                    reasoningEffort: high
                  backgroundMode: one-shot

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: one-shot

              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
                disabled: true

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          # ── creator surface ─────────────────────────────────────────────────────────

          # Creator delta 2: read-only inspection of the running composition.
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'

          # Creator delta 3: persistent profile changes. Without a
          # `profileContext` there is no profile to edit, so both rows turn
          # themselves off rather than failing the mount.
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"

          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: !!js "!ctx.get('profileContext')"

          # ── presentation (PTC) ──────────────────────────────────────────────────────

          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: ptc

          - id: present
            name: '@deepseek-ai/dsh-tool-present'
